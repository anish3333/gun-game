<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recoil Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #04060a; height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; }

#overlay {
  position: absolute;
  inset: 0;
  background: #04060a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 16px;
}
.overlay-title { font-family: 'Orbitron', sans-serif; font-size: 28px; letter-spacing: 6px; color: #4af0c8; }
.overlay-sub { font-size: 12px; letter-spacing: 3px; color: #4af0c850; }
.overlay-status { font-size: 13px; letter-spacing: 2px; color: #4af0c880; margin-top: 8px; }
.blink { animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* Lobby Styles */
#lobby-menu {
  display: none;
  flex-direction: column;
  gap: 20px;
  max-width: 500px;
  padding: 40px;
  background: linear-gradient(135deg, #0a0d12, #0f1520);
  border: 1px solid #1a2535;
  border-radius: 8px;
}
#lobby-menu.active { display: flex; }

.menu-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.menu-label { 
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; 
  letter-spacing: 3px; 
  color: #4af0c8;
  text-transform: uppercase;
}

.weapon-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.weapon-btn {
  padding: 12px;
  background: #0a0f15;
  border: 1px solid #1a2535;
  border-radius: 4px;
  color: #c8d8e8;
  font-size: 11px;
  cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  transition: all 0.2s;
  text-align: center;
}
.weapon-btn:hover {
  border-color: #4af0c8;
  color: #4af0c8;
}
.weapon-btn.selected {
  background: #4af0c820;
  border-color: #4af0c8;
  color: #4af0c8;
}

.action-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.action-btn {
  padding: 12px;
  background: #4af0c820;
  border: 1px solid #4af0c8;
  border-radius: 4px;
  color: #4af0c8;
  font-size: 12px;
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
}
.action-btn:hover {
  background: #4af0c840;
}
.action-btn:active {
  transform: scale(0.98);
}

#room-code-input {
  padding: 10px;
  background: #0a0f15;
  border: 1px solid #1a2535;
  border-radius: 4px;
  color: #c8d8e8;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
}
#room-code-input:focus {
  outline: none;
  border-color: #4af0c8;
  color: #4af0c8;
}

.room-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 150px;
  overflow-y: auto;
}
.room-item {
  padding: 10px;
  background: #0a0f15;
  border: 1px solid #1a2535;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.room-item:hover {
  background: #151f2a;
  border-color: #4af0c8;
}

.error-msg {
  color: #f04a4a;
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

#room-display {
  display: none;
  flex-direction: column;
  gap: 16px;
  max-width: 400px;
  padding: 30px;
  background: linear-gradient(135deg, #0a0d12, #0f1520);
  border: 1px solid #1a2535;
  border-radius: 8px;
}
#room-display.active { display: flex; }

.room-code-box {
  text-align: center;
  padding: 20px;
  background: #0a0f15;
  border: 2px solid #4af0c8;
  border-radius: 4px;
}
.room-code-label { font-size: 10px; letter-spacing: 2px; color: #4af0c850; }
.room-code-value { 
  font-family: 'Orbitron', sans-serif;
  font-size: 32px; 
  letter-spacing: 4px; 
  color: #4af0c8;
  margin-top: 8px;
}

.waiting-text {
  text-align: center;
  font-size: 12px;
  letter-spacing: 2px;
  color: #4af0c880;
  margin: 10px 0;
}
.waiting-text.blink { animation: blink 1.2s infinite; }

#game-wrap {
  position: relative;
  width: 680px;
}
canvas { display: block; border-radius: 8px; }

#hud-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  background: #0a0d12;
  border-radius: 8px 8px 0 0;
  border: 1px solid #1a2230;
  border-bottom: none;
}
.hud-title { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 3px; color: #4af0c860; }
#ping-display { font-size: 10px; color: #4af0c850; letter-spacing: 1px; }

#hud-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: #1a2230;
  border-radius: 0 0 8px 8px;
  border: 1px solid #1a2230;
  border-top: none;
  overflow: hidden;
}
.player-hud {
  background: #0a0d12;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.player-hud.you { border-top: 2px solid #4af0c8; }
.player-hud.opponent { border-top: 2px solid #f0a84a; }
.phud-info { flex: 1; }
.phud-name { font-family: 'Orbitron', sans-serif; font-size: 10px; color: #c8d8e8; letter-spacing: 1px; }
.phud-tag { font-size: 9px; color: #2a4050; margin-top: 2px; letter-spacing: 1px; }
.hp-bar-wrap { width: 80px; }
.hp-bar-bg { height: 3px; background: #1a2530; border-radius: 2px; overflow: hidden; }
.hp-bar-fill { height: 100%; border-radius: 2px; transition: width 0.1s; }
.hp-fill-you { background: #4af0c8; }
.hp-fill-opp { background: #f0a84a; }
.hp-val { font-size: 10px; color: #4af0c8; text-align: right; margin-top: 2px; }
.hp-val.opp { color: #f0a84a; }
.score-display { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #4af0c8; min-width: 24px; text-align: right; }
.score-display.opp { color: #f0a84a; }

#aim-hint { 
  position: absolute; 
  bottom: 52px; 
  left: 50%; 
  transform: translateX(-50%);
  font-size: 9px; 
  letter-spacing: 2px; 
  color: #2a3a4a; 
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">
  <div class="overlay-title">RECOIL // ARENA</div>
  <div class="overlay-sub">— recoil is movement —</div>
  <div class="overlay-status blink" id="overlay-status">connecting to server...</div>
</div>

<!-- Lobby Menu -->
<div id="lobby-menu">
  <div class="overlay-title">RECOIL // ARENA</div>
  
  <div class="menu-section">
    <div class="menu-label">SELECT WEAPON</div>
    <div class="weapon-grid" id="weapon-grid"></div>
  </div>

  <div id="error-container"></div>

  <div class="menu-section">
    <div class="menu-label">CREATE NEW MATCH</div>
    <button class="action-btn" id="create-room-btn">CREATE ROOM</button>
  </div>

  <div class="menu-section">
    <div class="menu-label">OR JOIN EXISTING</div>
    <input type="text" id="room-code-input" placeholder="ENTER ROOM CODE" maxlength="4">
    <button class="action-btn" id="join-room-btn">JOIN ROOM</button>
  </div>

  <div class="menu-section">
    <div class="menu-label">AVAILABLE ROOMS</div>
    <div class="room-list" id="room-list"></div>
  </div>
</div>

<!-- Room Display (waiting for opponent) -->
<div id="room-display">
  <div class="overlay-title">WAITING FOR OPPONENT</div>
  <div class="room-code-box">
    <div class="room-code-label">ROOM CODE</div>
    <div class="room-code-value" id="room-code-display"></div>
  </div>
  <div class="waiting-text blink">connecting...</div>
</div>

<div id="game-wrap">
  <div id="hud-top">
    <div class="hud-title">RECOIL // ARENA</div>
    <div id="ping-display">ping: —</div>
  </div>
  <canvas id="arena" width="680" height="480"></canvas>
  <div id="aim-hint">MOVE MOUSE TO AIM · CLICK TO FIRE</div>
  <div id="hud-bottom">
    <div class="player-hud you">
      <div class="phud-info">
        <div class="phud-name" id="you-name">YOU</div>
        <div class="phud-tag" id="you-weapon">—</div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-bg"><div class="hp-bar-fill hp-fill-you" id="hp-you" style="width:100%"></div></div>
        <div class="hp-val" id="hp-you-val">100</div>
      </div>
      <div class="score-display" id="score-you">0</div>
    </div>
    <div class="player-hud opponent">
      <div class="phud-info">
        <div class="phud-name" id="opp-name">OPPONENT</div>
        <div class="phud-tag" id="opp-weapon">—</div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-bg"><div class="hp-bar-fill hp-fill-opp" id="hp-opp" style="width:100%"></div></div>
        <div class="hp-val opp" id="hp-opp-val">100</div>
      </div>
      <div class="score-display opp" id="score-opp">0</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const W = 680, H = 480;
const ARENA = { x: 30, y: 30, w: 620, h: 420 };

let ws = null;
let myId = null;
let myWeapon = null;
let shooting = false;
let mouseAngle = 0;
let gameState = { players: [], bullets: [] };
let sparks = [];
let hitNumbers = [];
let pingStart = 0;
let currentPing = 0;

// Game state
let gamePhase = 'connecting'; // connecting | lobby | in-game
let currentRoom = null;
let availableWeapons = [];

const COLORS = { pistol: '#4af0c8', shotgun: '#f0a84a', smg: '#a84af0', sniper: '#f04a4a' };

// ── Connection & Lobby ───────────────────────────────────────────────────

function connect() {
  gamePhase = 'connecting';
  ws = new WebSocket('ws://localhost:3000/ws');

  ws.onopen = () => {
    console.log('Connected to server');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    showError('Disconnected from server');
  };

  ws.onerror = () => {
    showError('Cannot reach server · is it running?');
  };
}

function send(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

function showError(text) {
  const container = document.getElementById('error-container');
  container.innerHTML = `<div class="error-msg">${text}</div>`;
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'hello':
      gamePhase = 'lobby';
      availableWeapons = Object.keys(msg.weapons);
      renderWeaponGrid(msg.weapons);
      updateRoomList(msg.rooms || []);
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('lobby-menu').classList.add('active');
      pingInterval();
      break;

    case 'room_created':
      currentRoom = { code: msg.code, playerId: msg.playerId };
      myId = msg.playerId;
      myWeapon = msg.weapon;
      showRoomWaiting(msg.code);
      break;

    case 'room_joined':
      currentRoom = { code: msg.code, playerId: msg.playerId };
      myId = msg.playerId;
      myWeapon = msg.weapon;
      showRoomWaiting(msg.code);
      break;

    case 'room_list':
      updateRoomList(msg.rooms || []);
      break;

    case 'match_start':
      gamePhase = 'in-game';
      document.getElementById('lobby-menu').classList.remove('active');
      document.getElementById('room-display').classList.remove('active');
      document.getElementById('game-wrap').style.display = 'block';
      msg.players.forEach(p => {
        if (p.id !== myId) {
          document.getElementById('opp-name').textContent = 'OPPONENT';
          document.getElementById('opp-weapon').textContent = p.weaponType;
        }
      });
      document.getElementById('you-name').textContent = 'YOU';
      document.getElementById('you-weapon').textContent = myWeapon + ' · click to fire';
      break;

    case 'snapshot':
      gameState = msg;
      updateHUD();
      break;

    case 'hit':
      spawnHitNumber(msg.playerId, msg.damage);
      spawnSparks(msg.playerId, msg.damage);
      break;

    case 'player_died':
      spawnDeathEffect(msg.playerId);
      break;

    case 'opponent_disconnected':
      gamePhase = 'lobby';
      document.getElementById('game-wrap').style.display = 'none';
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('overlay-status').textContent = 'opponent disconnected · reload to find new match';
      break;

    case 'pong':
      currentPing = Math.round(performance.now() - pingStart);
      document.getElementById('ping-display').textContent = `ping: ${currentPing}ms`;
      break;

    case 'error':
      showError(msg.message);
      break;
  }
}

function renderWeaponGrid(weapons) {
  const grid = document.getElementById('weapon-grid');
  grid.innerHTML = '';
  availableWeapons.forEach(type => {
    const def = weapons[type];
    const btn = document.createElement('button');
    btn.className = 'weapon-btn';
    btn.textContent = `${def.label}\n${def.desc}`;
    btn.onclick = () => selectWeapon(type);
    if (type === 'pistol') btn.classList.add('selected');
    grid.appendChild(btn);
  });
  myWeapon = 'pistol'; // default selection
}

function selectWeapon(type) {
  myWeapon = type;
  document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('selected'));
  event.target.closest('.weapon-btn').classList.add('selected');
}

function updateRoomList(rooms) {
  const list = document.getElementById('room-list');
  if (rooms.length === 0) {
    list.innerHTML = '<div style="color: #4af0c850; font-size: 11px;">no rooms available</div>';
    return;
  }
  list.innerHTML = '';
  rooms.forEach(room => {
    const item = document.createElement('div');
    item.className = 'room-item';
    item.textContent = `${room.code}  ·  ${room.players}/2 players`;
    item.onclick = () => joinRoom(room.code);
    list.appendChild(item);
  });
}

function showRoomWaiting(code) {
  document.getElementById('lobby-menu').classList.remove('active');
  document.getElementById('room-display').classList.add('active');
  document.getElementById('room-code-display').textContent = code;
}

document.getElementById('create-room-btn').onclick = () => {
  send({ type: 'create_room', weapon: myWeapon });
};

document.getElementById('join-room-btn').onclick = () => {
  const code = document.getElementById('room-code-input').value.toUpperCase().trim();
  if (code.length !== 4) {
    showError('Room code must be 4 characters');
    return;
  }
  joinRoom(code);
};

function joinRoom(code) {
  send({ type: 'join_room', code, weapon: myWeapon });
}

function pingInterval() {
  setInterval(() => {
    if (ws && ws.readyState === 1) {
      pingStart = performance.now();
      send({ type: 'ping' });
    }
  }, 2000);
}

// ── Game Functions ───────────────────────────────────────────────────────

function getPlayer(id) {
  return gameState.players.find(p => p.id === id);
}

function updateHUD() {
  const me = getPlayer(myId);
  const opp = gameState.players.find(p => p.id !== myId);
  if (me) {
    const hp = Math.max(0, me.hp);
    document.getElementById('hp-you').style.width = hp + '%';
    document.getElementById('hp-you-val').textContent = hp;
    document.getElementById('score-you').textContent = me.score;
  }
  if (opp) {
    const hp = Math.max(0, opp.hp);
    document.getElementById('hp-opp').style.width = hp + '%';
    document.getElementById('hp-opp-val').textContent = hp;
    document.getElementById('score-opp').textContent = opp.score;
  }
}

function spawnSparks(playerId, damage) {
  const p = getPlayer(playerId);
  if (!p) return;
  const color = p.weaponType === 'pistol' ? '#4af0c8' : '#f0a84a';
  for (let i = 0; i < Math.min(damage / 2, 8); i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3 + 1;
    sparks.push({ x: p.x, y: p.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color });
  }
}

function spawnDeathEffect(playerId) {
  const p = getPlayer(playerId);
  if (!p) return;
  const color = p.weaponType === 'pistol' ? '#4af0c8' : '#f0a84a';
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 5 + 2;
    sparks.push({ x: p.x, y: p.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1.5, color });
  }
}

function spawnHitNumber(playerId, damage) {
  const p = getPlayer(playerId);
  if (!p) return;
  hitNumbers.push({
    x: p.x + (Math.random()-0.5)*20,
    y: p.y - 20,
    vy: -1.5,
    text: '-' + damage,
    life: 1,
    color: playerId === myId ? '#f04a4a' : '#f0a84a',
  });
}

function drawArena() {
  ctx.fillStyle = '#060911';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a2535';
  ctx.lineWidth = 0.5;
  const gs = 40;
  for (let x = ARENA.x; x <= ARENA.x + ARENA.w; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, ARENA.y); ctx.lineTo(x, ARENA.y + ARENA.h); ctx.stroke();
  }
  for (let y = ARENA.y; y <= ARENA.y + ARENA.h; y += gs) {
    ctx.beginPath(); ctx.moveTo(ARENA.x, y); ctx.lineTo(ARENA.x + ARENA.w, y); ctx.stroke();
  }
  ctx.strokeStyle = '#2a3a50';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);
  ctx.strokeStyle = '#4af0c830';
  ctx.lineWidth = 0.5;
  const cs = 14;
  [[ARENA.x,ARENA.y],[ARENA.x+ARENA.w,ARENA.y],[ARENA.x,ARENA.y+ARENA.h],[ARENA.x+ARENA.w,ARENA.y+ARENA.h]].forEach(([cx,cy],i) => {
    const sx = i%2===0?1:-1, sy = i<2?1:-1;
    ctx.beginPath(); ctx.moveTo(cx+sx*cs,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,cy+sy*cs); ctx.stroke();
  });
}

function drawGun(p) {
  const isPistol = p.weaponType === 'pistol';
  const color = COLORS[p.weaponType] || '#4af0c8';
  const dim = isPistol ? '#1a6050' : '#604010';

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);

  if (!p.alive) {
    ctx.globalAlpha = 0.2;
  }

  const scale = isPistol ? 0.55 : 0.65;
  ctx.scale(scale, scale);

  if (isPistol) {
    ctx.fillStyle = '#0d1520';
    ctx.beginPath(); ctx.roundRect(-24,-16,80,22,3); ctx.fill();
    ctx.fillStyle = '#1e2d3f';
    ctx.fillRect(-22,-16,76,5);
    ctx.fillStyle = '#0a0f15';
    ctx.fillRect(8,-13,28,8);
    ctx.fillStyle = dim;
    ctx.fillRect(8,-13,28,7);
    ctx.fillStyle = '#0d1520';
    ctx.fillRect(-24,-8,62,15);
    ctx.fillStyle = '#0a1018';
    ctx.fillRect(-22,7,46,4);
    ctx.strokeStyle = '#1e2d3f';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(14,11); ctx.lineTo(14,22); ctx.arc(22,22,8,Math.PI,0); ctx.lineTo(30,11); ctx.stroke();
    ctx.fillStyle = '#f0a84a';
    ctx.beginPath(); ctx.ellipse(20,18,2.5,5,0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#131c28';
    ctx.beginPath();
    ctx.moveTo(-24,11); ctx.lineTo(-24,50); ctx.quadraticCurveTo(-24,56,-16,56);
    ctx.lineTo(12,56); ctx.quadraticCurveTo(16,56,16,50); ctx.lineTo(16,11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dim; ctx.fillRect(-24,11,3,40);
    ctx.fillStyle = color; ctx.fillRect(-24,11,1.5,40);
    ctx.fillStyle = color; ctx.fillRect(56,-12,3,4);
    ctx.fillStyle = dim; ctx.fillRect(-16,-20,10,6);
    ctx.fillStyle = color; ctx.fillRect(-14,-18,3,4); ctx.fillRect(-8,-18,3,4);
  } else {
    ctx.fillStyle = '#1a1a10';
    ctx.beginPath(); ctx.roundRect(-28,-18,90,26,3); ctx.fill();
    ctx.fillStyle = '#282818';
    ctx.fillRect(-26,-18,86,6);
    ctx.fillStyle = '#0d0d08';
    ctx.fillRect(0,-14,40,10);
    ctx.fillStyle = dim; ctx.fillRect(0,-14,40,10);
    ctx.fillStyle = '#151510'; ctx.fillRect(-28,-4,70,14);
    ctx.fillStyle = '#0a0a06';
    for(let i=0;i<5;i++) ctx.fillRect(-26+i*13,9,3,4);
    ctx.strokeStyle='#282818'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(16,24); ctx.arc(26,24,10,Math.PI,0); ctx.lineTo(36,10); ctx.stroke();
    ctx.fillStyle='#4af0c8';
    ctx.beginPath(); ctx.ellipse(24,20,3,6,0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1a10';
    ctx.beginPath();
    ctx.moveTo(-28,10); ctx.lineTo(-28,55); ctx.quadraticCurveTo(-28,62,-18,62);
    ctx.lineTo(14,62); ctx.quadraticCurveTo(16,62,16,55); ctx.lineTo(16,10); ctx.closePath(); ctx.fill();
    ctx.fillStyle=dim; ctx.fillRect(-28,10,3,48);
    ctx.fillStyle=color; ctx.fillRect(-28,10,1.5,48);
    ctx.fillStyle=color; ctx.fillRect(60,-14,3,5);
    ctx.fillStyle=dim; ctx.fillRect(-18,-24,14,7);
    ctx.fillStyle=color; ctx.fillRect(-16,-22,3,5); ctx.fillRect(-8,-22,3,5);
  }

  if (p.muzzleFlash > 0.1) {
    const f = p.muzzleFlash;
    const bx = isPistol ? 60 : 68;
    ctx.save();
    ctx.globalAlpha = f * 0.9;
    ctx.fillStyle = '#fff8e0';
    ctx.beginPath(); ctx.ellipse(bx+14*f,0,18*f,7*f,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(bx+8*f,0,10*f,4*f,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawFrame() {
  if (gamePhase !== 'in-game') {
    requestAnimationFrame(drawFrame);
    return;
  }

  drawArena();

  gameState.bullets.forEach(b => {
    const owner = gameState.players.find(p => p.id === b.ownerId);
    const color = owner ? (COLORS[owner.weaponType] || '#4af0c8') : '#4af0c8';
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx*3, b.y - b.vy*3);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  for (let i = sparks.length-1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.12; s.life -= 0.04;
    if (s.life <= 0) { sparks.splice(i,1); continue; }
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.5*s.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let i = hitNumbers.length-1; i >= 0; i--) {
    const h = hitNumbers[i];
    h.y += h.vy; h.life -= 0.025;
    if (h.life <= 0) { hitNumbers.splice(i,1); continue; }
    ctx.globalAlpha = h.life;
    ctx.fillStyle = h.color;
    ctx.font = `bold 13px "Share Tech Mono"`;
    ctx.textAlign = 'center';
    ctx.fillText(h.text, h.x, h.y);
  }
  ctx.globalAlpha = 1;

  gameState.players.forEach(p => {
    if (p.id === myId) {
      ctx.save();
      ctx.strokeStyle = '#4af0c840';
      ctx.lineWidth = 1;
      ctx.setLineDash([3,4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    drawGun(p);
  });

  const me = getPlayer(myId);
  if (me && me.alive) {
    ctx.save();
    ctx.strokeStyle = '#4af0c830';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4,6]);
    const aimLen = 120;
    ctx.beginPath();
    ctx.moveTo(me.x + Math.cos(mouseAngle)*30, me.y + Math.sin(mouseAngle)*30);
    ctx.lineTo(me.x + Math.cos(mouseAngle)*aimLen, me.y + Math.sin(mouseAngle)*aimLen);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  requestAnimationFrame(drawFrame);
}

function sendInput() {
  if (!ws || ws.readyState !== 1 || !myId || gamePhase !== 'in-game') return;
  ws.send(JSON.stringify({ type: 'input', angle: mouseAngle, shoot: shooting }));
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const me = getPlayer(myId);
  if (me) {
    mouseAngle = Math.atan2(my - me.y, mx - me.x);
  }
});

canvas.addEventListener('mousedown', () => { shooting = true; });
canvas.addEventListener('mouseup', () => { shooting = false; });
canvas.addEventListener('mouseleave', () => { shooting = false; });

document.getElementById('game-wrap').style.display = 'none';
setInterval(sendInput, 1000/60);
connect();
drawFrame();
</script>
</body>
</html>
